{{- if .Values.enabled -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kairosdb.fullname" . }}
  labels:
{{ include "kairosdb.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kairosdb.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kairosdb.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "bash" ]
          args:
            - "-c"
            - "cp -f conf/overrides/*.conf conf && bin/kairosdb.sh run"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            #Grab all environment values
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              {{- if and (kindIs "map" $val) (hasKey $val "valueFrom") }}
              valueFrom:
                {{- toYaml $val.valueFrom | nindent 16 }}
              {{- else }}
              value: {{ $val | quote }}
              {{- end }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: kairos-config-volume
              mountPath: /opt/kairosdb/conf/overrides
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: kairos-config-volume
          configMap:
            name: kairosdb-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
